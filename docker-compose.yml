services:
  db:
    image: postgres:16-alpine
    container_name: financial_agent_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-financial_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finagent} -d ${POSTGRES_DB:-financial_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./financial-agent-backend
      dockerfile: Dockerfile
    container_name: financial_agent_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-finagent}:${POSTGRES_PASSWORD:-finagent_secret}@db:5432/${POSTGRES_DB:-financial_agent}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-finagent}:${POSTGRES_PASSWORD:-finagent_secret}@db:5432/${POSTGRES_DB:-financial_agent}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-super-secret-key-32-chars-minimum}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - SEED_DEFAULT_CATEGORIES=true
      - SEED_DEMO_DATA=true
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./financial-agent-frontend
      dockerfile: Dockerfile
    container_name: financial_agent_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
