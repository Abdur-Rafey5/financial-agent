version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: financial_agent_db
    restart: always
    environment:
      POSTGRES_USER: finagent
      POSTGRES_PASSWORD: finagent_secret
      POSTGRES_DB: financial_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./financial-agent-backend
      dockerfile: Dockerfile
    container_name: financial_agent_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finagent:finagent_secret@db:5432/financial_agent
      - DATABASE_URL_SYNC=postgresql://finagent:finagent_secret@db:5432/financial_agent
      - JWT_SECRET_KEY=dev-jwt-super-secret-key-32-chars-minimum
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./financial-agent-frontend
      dockerfile: Dockerfile
    container_name: financial_agent_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
